<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calendar Sync</title>
  <meta name="csrf-token" content="" />
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    label { display: block; margin-top: .5rem; }
    input, select, button { width: 100%; padding: .5rem; margin-top: .25rem; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  </style>
</head>
<body>
  <h1>Calendar Sync</h1>

  <div class="card">
    <h2>Connect external account</h2>
    <form id="accountForm">
      <label>Provider</label>
      <select id="provider" required>
        <option value="google">Google Calendar</option>
        <option value="microsoft">Outlook / Microsoft 365</option>
      </select>
      <button type="submit">Connect account (stub)</button>
    </form>
  </div>

  <div class="card">
    <h2>Create sync job</h2>
    <form id="jobForm">
      <label>Mailcow Calendar ID</label>
      <input id="mailcowCalendarId" value="default" required />

      <label>External account</label>
      <select id="externalAccountId" required></select>

      <label>External calendar ID</label>
      <input id="externalCalendarId" placeholder="primary" required />

      <label>Direction</label>
      <select id="direction" required>
        <option value="two_way">Two-way</option>
        <option value="mailcow_to_external">Mailcow to external only</option>
        <option value="external_to_mailcow">External to Mailcow only</option>
      </select>

      <label>Conflict policy</label>
      <select id="conflictPolicy" required>
        <option value="newest_wins">Newest update wins</option>
        <option value="prefer_mailcow">Prefer Mailcow</option>
        <option value="prefer_external">Prefer external calendar</option>
        <option value="manual">Manual conflict handling</option>
      </select>

      <label>Sync interval (seconds)</label>
      <input id="intervalSeconds" type="number" min="60" max="3600" value="300" required />

      <button type="submit">Create sync job</button>
    </form>
  </div>

  <div class="card">
    <h2>Connected accounts</h2>
    <table width="100%"><thead><tr><th>ID</th><th>Provider</th><th>Account</th><th>Status</th></tr></thead><tbody id="accountsBody"></tbody></table>
  </div>

  <div class="card">
    <h2>Sync jobs</h2>
    <table width="100%"><thead><tr><th>ID</th><th>Provider</th><th>Direction</th><th>Policy</th><th>Status</th><th>Last error</th></tr></thead><tbody id="jobsBody"></tbody></table>
  </div>

<script>
  function setCsrf(token) {
    document.querySelector('meta[name="csrf-token"]').setAttribute('content', token || '');
  }
  function csrf() { return document.querySelector('meta[name="csrf-token"]').getAttribute('content') || ''; }

  async function readErrorMessage(response, fallback) {
    try {
      const data = await response.json();
      if (data && typeof data.error === 'string' && data.error.length > 0) return data.error;
    } catch (e) {}
    return fallback + ` (HTTP ${response.status})`;
  }

  async function loadAccounts() {
    const r = await fetch('/api/calendar-sync.php?path=accounts', { credentials: 'include' });
    if (!r.ok) return [];
    const data = await r.json();
    setCsrf(data.csrf_token);
    const tbody = document.getElementById('accountsBody'); tbody.innerHTML = '';
    const select = document.getElementById('externalAccountId'); select.innerHTML = '';
    (data.items || []).forEach((a) => {
      const tr = document.createElement('tr');
      ['id','provider','provider_account_id','status'].forEach((k) => {
        const td = document.createElement('td'); td.textContent = String(a[k] ?? ''); tr.appendChild(td);
      });
      tbody.appendChild(tr);

      const opt = document.createElement('option');
      opt.value = a.id;
      opt.textContent = `${a.id} - ${a.provider} (${a.provider_account_id})`;
      select.appendChild(opt);
    });
    return data.items || [];
  }

  async function loadJobs() {
    const r = await fetch('/api/calendar-sync.php?path=jobs', { credentials: 'include' });
    if (!r.ok) return;
    const data = await r.json();
    setCsrf(data.csrf_token);
    const tbody = document.getElementById('jobsBody'); tbody.innerHTML = '';
    (data.items || []).forEach((j) => {
      const tr = document.createElement('tr');
      [j.id, j.provider, j.direction, j.conflict_policy, j.status, j.last_error_message || ''].forEach((v) => {
        const td = document.createElement('td'); td.textContent = String(v); tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  }

  document.getElementById('accountForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = { provider: document.getElementById('provider').value };
    const r = await fetch('/api/calendar-sync.php?path=accounts', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrf() },
      body: JSON.stringify(payload),
    });
    if (!r.ok) { alert(await readErrorMessage(r, 'Failed to connect account')); return; }
    await loadAccounts();
  });

  document.getElementById('jobForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
      mailcow_calendar_id: document.getElementById('mailcowCalendarId').value.trim(),
      external_account_id: Number(document.getElementById('externalAccountId').value),
      external_calendar_id: document.getElementById('externalCalendarId').value.trim(),
      direction: document.getElementById('direction').value,
      conflict_policy: document.getElementById('conflictPolicy').value,
      interval_seconds: Number(document.getElementById('intervalSeconds').value),
    };
    const r = await fetch('/api/calendar-sync.php?path=jobs', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrf() },
      body: JSON.stringify(payload),
    });
    if (!r.ok) { alert(await readErrorMessage(r, 'Failed to create job')); return; }
    await loadJobs();
  });

  (async function init() {
    await loadAccounts();
    await loadJobs();
  })();
</script>
</body>
</html>
