<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calendar Sync</title>
  <meta name="csrf-token" content="" />
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    label { display: block; margin-top: .5rem; }
    input, select, button { width: 100%; padding: .5rem; margin-top: .25rem; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .inline { display: flex; gap: 0.5rem; align-items: center; }
    .inline input { width: auto; }
    .provider-auth { margin-top: .5rem; display: none; }
  </style>
</head>
<body>
  <h1>Two-Way Calendar Sync</h1>
  <p>Logged-in Mailcow users can create multiple calendar sync links (Google/Outlook/CalDAV).</p>

  <div class="card">
    <h2>Add sync</h2>
    <form id="syncForm">
      <input id="csrfToken" type="hidden" name="csrf_token" value="" />
      <label>Sync name</label>
      <input id="name" maxlength="120" required />

      <div class="row">
        <div>
          <label>Calendar A email</label>
          <input id="emailA" type="email" required />
          <label>Provider A</label>
          <select id="providerA" required>
            <option value="mailcow">Mailcow</option>
            <option value="google">Google Calendar</option>
            <option value="outlook">Outlook Calendar</option>
          </select>
          <div id="googleAuthA" class="provider-auth">
            <button type="button" onclick="connectGoogle('A')">Connect Google (A)</button>
          </div>
        </div>
        <div>
          <label>Calendar B email</label>
          <input id="emailB" type="email" required />
          <label>Provider B</label>
          <select id="providerB" required>
            <option value="mailcow">Mailcow</option>
            <option value="google">Google Calendar</option>
            <option value="outlook">Outlook Calendar</option>
          </select>
          <div id="googleAuthB" class="provider-auth">
            <button type="button" onclick="connectGoogle('B')">Connect Google (B)</button>
          </div>
        </div>
      </div>

      <label>Sync direction</label>
      <select id="syncDirection" required>
        <option value="two_way">Two-way sync (A ↔ B)</option>
        <option value="a_to_b">One-way sync (A → B)</option>
        <option value="b_to_a">One-way sync (B → A)</option>
      </select>

      <label>Mailcow password (or app password)</label>
      <input id="mailcowSecret" type="password" autocomplete="new-password" required />

      <button type="submit">Add</button>
    </form>
  </div>

  <div class="card">
    <h2>Existing syncs</h2>
    <table id="syncTable" width="100%">
      <thead><tr><th>Name</th><th>A</th><th>B</th><th>Direction</th><th>Status</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const providerA = document.getElementById('providerA');
    const providerB = document.getElementById('providerB');

    function hydrateCsrfToken(serverToken = '') {
      const fallbackToken = typeof window.CALENDAR_SYNC_CSRF_TOKEN === 'string' ? window.CALENDAR_SYNC_CSRF_TOKEN : '';
      const token = typeof serverToken === 'string' && serverToken.length > 0 ? serverToken : fallbackToken;
      const csrfMeta = document.querySelector('meta[name="csrf-token"]');
      const csrfInput = document.getElementById('csrfToken');
      csrfMeta.setAttribute('content', token);
      csrfInput.value = token;
      return token;
    }

    function getCsrfToken() {
      const csrfInput = document.getElementById('csrfToken');
      return csrfInput.value;
    }

    function updateProviderAuthVisibility() {
      document.getElementById('googleAuthA').style.display = providerA.value === 'google' ? 'block' : 'none';
      document.getElementById('googleAuthB').style.display = providerB.value === 'google' ? 'block' : 'none';
    }

    function connectGoogle(side) {
      const popup = window.open('/api/oauth/google/start.php?side=' + encodeURIComponent(side), 'googleOAuth', 'width=520,height=700');
      if (!popup) alert('Please allow popups to connect Google Calendar.');
    }

    providerA.addEventListener('change', updateProviderAuthVisibility);
    providerB.addEventListener('change', updateProviderAuthVisibility);

    async function loadSyncs() {
      const r = await fetch('/api/calendar-sync.php', { credentials: 'include' });
      if (!r.ok) return;
      const data = await r.json();
      hydrateCsrfToken(data.csrf_token);
      const tbody = document.querySelector('#syncTable tbody');
      tbody.innerHTML = '';
      for (const s of data.items || []) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${s.name}</td><td>${s.email_a} (${s.provider_a})</td><td>${s.email_b} (${s.provider_b})</td><td>${s.sync_direction}</td><td>${s.status}</td>`;
        tbody.appendChild(tr);
      }
    }

    document.getElementById('syncForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      let csrfToken = getCsrfToken();
      if (!csrfToken) {
        await loadSyncs();
        csrfToken = getCsrfToken();
      }
      if (!csrfToken) {
        alert('Unable to create sync: CSRF token is unavailable. Refresh the page and try again.');
        return;
      }
      const payload = {
        name: document.getElementById('name').value.trim(),
        email_a: document.getElementById('emailA').value.trim(),
        email_b: document.getElementById('emailB').value.trim(),
        provider_a: providerA.value,
        provider_b: providerB.value,
        sync_direction: document.getElementById('syncDirection').value,
        mailcow_secret: document.getElementById('mailcowSecret').value
      };
      const r = await fetch('/api/calendar-sync.php', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRF-Token': csrfToken
        },
        credentials: 'include',
        body: JSON.stringify(payload)
      });
      if (r.ok) {
        document.getElementById('syncForm').reset();
        updateProviderAuthVisibility();
        await loadSyncs();
      } else {
        alert('Unable to create sync. Check login and inputs.');
      }
    });

    hydrateCsrfToken();
    updateProviderAuthVisibility();
    loadSyncs();
  </script>
</body>
</html>
